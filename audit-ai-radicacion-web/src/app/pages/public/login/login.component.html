<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="max-w-md w-full bg-white rounded-xl shadow-md p-8">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-gray-900">Plataforma AuditAI IBS</h2>
      <p class="text-gray-500 text-sm mt-2">Acceso seguro</p>
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="errorMessage()" class="bg-red-50 text-red-600 p-3 rounded-md text-sm mb-4">
      {{ errorMessage() }}
    </div>

    <!-- Formulario Normal -->
    <form *ngIf="!requiresOtp()" (ngSubmit)="login()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Correo corporativo</label>
        <input 
          type="email" 
          [ngModel]="email()" 
          (ngModelChange)="email.set($event)" 
          name="email"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          placeholder="usuario@ibs.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input 
          type="password" 
          [ngModel]="password()" 
          (ngModelChange)="password.set($event)" 
          name="password"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <button 
        type="submit" 
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
        Iniciar Sesión
      </button>
    </form>

    <!-- Pantalla Secundaria: OTP -->
    <form *ngIf="requiresOtp()" (ngSubmit)="validateOtp()" class="space-y-4">
      <div class="text-center mb-4">
        <p class="text-sm text-gray-600">Verificación en Dos Pasos (OTP)</p>
        <p class="text-xs text-gray-500 mt-1">Código enviado a tu dispositivo registrado</p>
      </div>
      
      <div>
        <input 
          type="text" 
          [ngModel]="otp()" 
          (ngModelChange)="otp.set($event)" 
          name="otp"
          maxlength="6"
          class="mt-1 block w-full text-center tracking-widest text-lg px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          placeholder="000000">
      </div>

      <button 
        type="submit" 
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none">
        Validar Código
      </button>
    </form>

    <div class="mt-6 text-xs text-center text-gray-400">
      (!) 5 intentos fallidos bloquean la cuenta 15min
    </div>
  </div>
</div>
